name: publish
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      bump: {description: bump, required: false, type: choice, options: [patch]}

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "version=0.0.0-test" >> $GITHUB_OUTPUT
          echo "release=false" >> $GITHUB_OUTPUT
          echo "repo=MaurerAnton/opencode" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.version.outputs.version || '0.0.0' }}
      release: ${{ steps.version.outputs.release || 'false' }}
      repo: ${{ steps.version.outputs.repo || '' }}
